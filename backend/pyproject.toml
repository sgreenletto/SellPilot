[project]
name = "sellpilot"
version = "1.0.0"
description = "SellPilot public backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "chromadb>=0.5.0",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.9",
    "mcp>=1.28.1",
    "openai>=1.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sentence-transformers>=3.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
sellpilot-create-admin = "sellpilot.cli.create_admin:main"
sellpilot-import-mock-data = "sellpilot.cli.import_mock_data:main"
sellpilot-import-knowledge = "sellpilot.cli.import_knowledge_data:main"
sellpilot-check-demo-readiness = "sellpilot.cli.check_demo_readiness:main"
sellpilot-start-api = "sellpilot.cli.start_api:main"
sellpilot-evaluate-member3 = "sellpilot.cli.evaluate_member3:main"
sellpilot-mcp = "sellpilot.mcp_server.server:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
